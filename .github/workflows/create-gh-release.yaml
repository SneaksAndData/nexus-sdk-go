name: Release a new version

on: workflow_dispatch

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    #if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.*'

      - name: Verify dependencies
        run: go mod verify

      - name: Install dependencies
        run: go mod vendor

      - name: Run go vet
        run: go vet ./...

      - name: Build linux-amd64
        run: GOOS=linux GOARCH=amd64 go build -v -buildmode=c-shared -o dist/nexus_sdk_linux_amd64.so main.go

      - name: Build linux-arm64
        run: GOOS=linux GOARCH=arm64 go build -v -buildmode=c-shared -o dist/nexus_sdk_linux_arm64.so main.go

      - name: Build darwin-arm64
        run: GOOS=darwin GOARCH=arm64 go build -v -buildmode=c-shared -o dist/nexus_sdk_darwin_arm64.so main.go
          
