name: Release a new version
run-name: Release C-Shared built assets from ${{github.ref_name}} by @${{ github.actor }}

on: workflow_dispatch

permissions: {}

jobs:
  base_release:
    name: Create Base Release
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write # create release / upload release assets
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.*'

      - name: Verify dependencies
        run: go mod verify

      - name: Install dependencies
        run: go mod vendor

      - name: Build linux-amd64
        run: |
          GOOS=linux GOARCH=amd64 go build -v -buildmode=c-shared -o dist/nexus_sdk_linux_amd64.so main.go
          tar -czf nexus_sdk_linux_amd64.tar.gz dist/
          mkdir release && mv nexus_sdk_linux_amd64.tar.gz release/

      - name: Create Release
        uses: SneaksAndData/github-actions/semver_release@e3f4ea513c548adf4e774364872966d0d4a3d2fe # v0.1.12
        with:
          major_v: 1
          minor_v: 2
          assets_path: release
        id: release

  linux_arm64:
    name: Add ARM64 build
    needs: [ base_release ]
    runs-on: ubuntu-24.04-arm
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write # create release / upload release assets

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.*'

      - name: Verify dependencies
        run: go mod verify

      - name: Install dependencies
        run: go mod vendor

      - name: Build linux-arm64
        run: |
          GOOS=linux GOARCH=arm64 go build -v -buildmode=c-shared -o dist/nexus_sdk_linux_arm64.so main.go
          tar -czf nexus_sdk_linux_arm64.tar.gz dist/
          mkdir release && mv nexus_sdk_linux_arm64.tar.gz release/

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_BASE_RELEASE_OUTPUTS_VERSION: ${{needs.base_release.outputs.version}}
        run: |
          gh release upload "${NEEDS_BASE_RELEASE_OUTPUTS_VERSION}" release/*.*

  macos:
    name: Add MacOS Silicon build
    needs: [ base_release ]
    runs-on: macos-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write # create release / upload release assets

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.*'

      - name: Verify dependencies
        run: go mod verify

      - name: Install dependencies
        run: go mod vendor

      - name: Build darwin-arm64
        run: |
          GOARCH=arm64 go build -v -buildmode=c-shared -o dist/nexus_sdk_darwin_arm64.so main.go
          tar -czf nexus_sdk_darwin_arm64.tar.gz dist/
          mkdir release && mv nexus_sdk_darwin_arm64.tar.gz release/

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_BASE_RELEASE_OUTPUTS_VERSION: ${{needs.base_release.outputs.version}}
        run: |
          gh release upload "${NEEDS_BASE_RELEASE_OUTPUTS_VERSION}" release/*.*
