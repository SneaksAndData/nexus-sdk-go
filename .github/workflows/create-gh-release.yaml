name: Release a new version
run-name: Release C-Shared built assets from ${{github.ref_name}} by @${{ github.actor }}

on: workflow_dispatch

jobs:
  base_release:
    name: Create Base Release
    runs-on: ubuntu-latest
    #if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.*'

      - name: Verify dependencies
        run: go mod verify

      - name: Install dependencies
        run: go mod vendor

      - name: Build linux-amd64
        run: GOOS=linux GOARCH=amd64 go build -v -buildmode=c-shared -o dist/nexus_sdk_linux_amd64.so main.go

      - name: Create Release
        uses: SneaksAndData/github-actions/semver_release@v0.1.11
        with:
          major_v: 0
          minor_v: 1
          assets_path: dist
        id: release

  linux_arm64:
    name: Add ARM64 build
    needs: [ base_release ]
    runs-on: ubuntu-24.04-arm
    #if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.*'

      - name: Verify dependencies
        run: go mod verify

      - name: Install dependencies
        run: go mod vendor

      - name: Build linux-arm64
        run: GOOS=linux GOARCH=arm64 go build -v -buildmode=c-shared -o dist/nexus_sdk_linux_arm64.so main.go

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{needs.base_release.outputs.version}} dist/*.*

  macos:
    name: Add MacOS Silicon build
    needs: [ base_release ]
    runs-on: macos-13
    #if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.*'

      - name: Verify dependencies
        run: go mod verify

      - name: Install dependencies
        run: go mod vendor

      - name: Build darwin-arm64
        run: go build -v -buildmode=c-shared -o dist/nexus_sdk_darwin_arm64.so main.go

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{needs.base_release.outputs.version}} dist/*.*
