name: Run tests with coverage
run-name: Validate ${{github.ref_name}} by @${{ github.actor }}

on:
  push:
    branches: [ main ]  
  pull_request:
    branches: [ main ]


jobs:
  test:
    name: Test SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.*'
                 
      - name: Verify dependencies
        run: go mod verify
        
      - name: Install dependencies
        run: go mod vendor
        
      - name: Build
        run: go build -v ./...
        
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
      
      - name: Install Nexus Stack
        run: |
          helm dependency build ./helm && helm install nexus-test-stack --namespace nexus --create-namespace --version 0.0.0 ./.helm

