name: Run tests with coverage
run-name: Validate ${{github.ref_name}} by @${{ github.actor }}

on:
  push:
    branches: [ main ]  
  pull_request:
    branches: [ main ]


jobs:
  test:
    name: Test SDK
    runs-on: ubuntu-latest-16-cores-public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.*'
                 
      - name: Verify dependencies
        run: go mod verify
        
      - name: Install dependencies
        run: go mod vendor
        
      - name: Build
        run: go build -v ./...
        
      - name: Create Controller Kind Cluster
        uses: helm/kind-action@main
        with:
          cluster_name: 'nexus-controller'
          cloud_provider: true

      - name: Create Shard Kind Cluster
        uses: helm/kind-action@main
        with:
          cluster_name: 'nexus-shard-0'

      - name: Create necessary configurations
        run: |
          set -e
          
          kind export kubeconfig --name nexus-shard-0 --kubeconfig /tmp/kind-nexus-shard-0.kubeconfig
          shards_config=$(cat /tmp/kind-nexus-shard-0.kubeconfig)
          
          kubectl --context kind-nexus-controller create namespace nexus
          kubectl --context kind-nexus-controller -n nexus create secret generic nexus-shards --from-literal=kind-nexus-shard-0.kubeconfig="$shards_config"
          kubectl --context kind-nexus-controller -n nexus create secret generic dummy --from-literal=dummy=dummy

      - name: Install Scylla
        run: |
          set -e
          
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm repo add scylla https://scylla-operator-charts.storage.googleapis.com/stable --force-update
          
          helm --kube-context kind-nexus-controller install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --version v1.18.2 --set crds.enabled=true
          sleep 15
          helm --kube-context kind-nexus-controller install scylla-operator scylla/scylla-operator --namespace scylla-operator --create-namespace --version 1.17.1
          sleep 30
          helm --kube-context kind-nexus-controller install scylla scylla/scylla --namespace scylla --create-namespace --version 1.17.1 --set developerMode=true --set datacenter=us-east-1 \
          --set racks[0].name=us-east-1b --set members=1 --set storage.capacity=5Gi --set storage.storageClassName=standard \
          --set racks[0].resources.limits.memory=1Gi --set racks[0].resources.limits.cpu=1000m --set racks[0].resources.requests.memory=1Gi --set racks[0].resources.requests.cpu=1000m
          
          sleep 60
          
          kubectl --context kind-nexus-controller -n scylla get pods
          
          kubectl --context kind-nexus-controller -n scylla apply -f ./test-resources/scylla-lb-service.yaml
          
          sleep 15
          
          SCYLLA_LB_IP=$(kubectl --context kind-nexus-controller -n scylla get svc/scylla-cql -o=jsonpath='{.status.loadBalancer.ingress[0].ip}')
          kubectl --context kind-nexus-controller -n nexus create secret generic nexus-scylla --from-literal=NEXUS__SCYLLA_CQL_STORE__HOSTS="$SCYLLA_LB_IP:9042"
          kubectl --context kind-nexus-controller -n nexus create secret generic nexus-s3 \
          --from-literal=NEXUS__S3_BUFFER__ACCESS_KEY_ID="test" \
          --from-literal=NEXUS__S3_BUFFER__ENDPOINT="http://localhost:9000" \
          --from-literal=NEXUS__S3_BUFFER__REGION="us-east-1" \
          --from-literal=NEXUS__S3_BUFFER__SECRET_ACCESS_KEY="test"
      
      

      - name: Install Nexus Stack
        run: |
          helm dependency build ./.helm && helm install nexus-test-stack --kube-context kind-nexus-controller --namespace nexus --create-namespace --version 0.0.0 ./.helm

      - name: Fetch LB IP addresses
        run: | 
          sleep 20
          SCHEDULER_LB_IP=$(kubectl --context kind-nexus-controller -n nexus get svc/nexus-lb -o=jsonpath='{.status.loadBalancer.ingress[0].ip}')
          RECEIVER_LB_IP=$(kubectl --context kind-nexus-controller -n nexus get svc/nexus-receiver-lb -o=jsonpath='{.status.loadBalancer.ingress[0].ip}')
          
                   
          pod=$(kubectl get pods --context kind-nexus-controller -n nexus --no-headers -o custom-columns=":metadata.name" | head -n 1)
          msg=$(kubectl get pod $pod --context kind-nexus-controller -n nexus -o yaml)
          
          echo "$msg"
          
          kubectl logs --context kind-nexus-controller -n nexus $pod
          
          echo "SCHEDULER_LB_IP=$SCHEDULER_LB_IP" >> "$GITHUB_OUTPUT"
          echo "RECEIVER_LB_IP=$RECEIVER_LB_IP" >> "$GITHUB_OUTPUT"
        id: ips

      - name: Test
        env:
          NEXUS_TEST_SCHEDULER_URL: "http://${{steps.ips.outputs.SCHEDULER_LB_IP}}:8080"
        run: go test ./... -coverprofile=./cover.out -covermode=atomic -coverpkg=./...

      - name: Visualise Coverage
        if: ${{ github.ref != 'refs/heads/main' && always() }}
        run: go tool cover -html=cover.out -o=cover.html

      - name: Upload Coverage
        if: ${{ github.ref != 'refs/heads/main' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.html
          retention-days: 1
        id: cover

      - name: Post Coverage
        if: ${{ github.ref != 'refs/heads/main' && always() }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.number }}
          body: |
            New [coverage report](${{ steps.cover.outputs.artifact-url }}) available :sparkles:

      - name: Check Coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml

          ## badge is created and committed only for main branch
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          ## name of branch where badges are stored
          ## ideally this should be orphan branch (see below how to create this branch)
          git-branch: badges
