name: Run tests with coverage
run-name: Validate ${{github.ref_name}} by @${{ github.actor }}

on:
  push:
    branches: [ main ]  
  pull_request:
    branches: [ main ]


jobs:
  test:
    name: Test SDK
    runs-on: ubuntu-latest-16-cores-public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.*'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.x'
          architecture: 'x64'
                 
      - name: Verify dependencies
        run: go mod verify
        
      - name: Install dependencies
        run: go mod vendor
        
      - name: Build
        run: go build -v ./...
        
      - name: Create Controller Kind Cluster
        uses: helm/kind-action@main
        with:
          cluster_name: 'nexus-controller'
          cloud_provider: true

      - name: Create Shard Kind Cluster
        uses: helm/kind-action@main
        with:
          cluster_name: 'nexus-shard-0'

      - name: Create necessary configurations
        run: |
          set -e
          
          kind export kubeconfig --name nexus-shard-0 --kubeconfig /tmp/kind-nexus-shard-0.kubeconfig
          shards_config=$(cat /tmp/kind-nexus-shard-0.kubeconfig)
          
          kubectl --context kind-nexus-controller create namespace nexus
          kubectl --context kind-nexus-controller -n nexus create secret generic nexus-shards --from-literal=kind-nexus-shard-0.kubeconfig="$shards_config"
          kubectl --context kind-nexus-controller -n nexus create secret generic dummy --from-literal=dummy=dummy
          
          kubectl --context kind-nexus-controller -n nexus create secret generic nexus-scylla --from-literal=NEXUS__SCYLLA_CQL_STORE__HOSTS="127.0.0.1:9042"
          kubectl --context kind-nexus-controller -n nexus create secret generic nexus-s3 \
          --from-literal=NEXUS__S3_BUFFER__ACCESS_KEY_ID="test" \
          --from-literal=NEXUS__S3_BUFFER__ENDPOINT="http://localhost:9000" \
          --from-literal=NEXUS__S3_BUFFER__REGION="us-east-1" \
          --from-literal=NEXUS__S3_BUFFER__SECRET_ACCESS_KEY="test"
          
          docker run --name some-scylla --network host -d scylladb/scylla --listen-address 127.0.0.1          

      - name: Configure Database
        run: |
          set -e
          pip install scylla-cqlsh
          
          echo 'Checking connectivity'
          
          cqlsh localhost -e 'SELECT * FROM system.local'
          
          echo 'Creating keyspace'
          
          cqlsh localhost -e "CREATE KEYSPACE nexus WITH replication = { 'class': 'SimpleStrategy', 'replication_factor': 1 };"
          
          echo 'Applying checkpoints table'
          
          cqlsh localhost -f ./test-resources/storage/checkpoints.cql
          
          echo 'Checking table'
          
          cqlsh localhost -e 'SELECT * FROM nexus.checkpoints'
