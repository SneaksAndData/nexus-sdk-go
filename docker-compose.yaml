version: '3.3'

services:
  scylla:
    container_name: scylla
    image: scylladb/scylla
    network_mode: host
    command:
      - "--listen-address"
      - "127.0.0.1"
      - "--smp"
      - "1"
    healthcheck:
      test: ["CMD-SHELL", "[ $$(nodetool statusgossip) = running ]"]
      interval: 30s
      timeout: 10s
      retries: 5
  minio:
    container_name: minio
    hostname: minio-e2e
    image: quay.io/minio/minio
    network_mode: host
    restart: always
    command:
      - server
      - /data
      - "--console-address"
      - ":9123"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9123" ]
      interval: 30s
      timeout: 10s
      retries: 5
  nexus:
    container_name: nexus
    network_mode: host
    depends_on:
      scylla:
        condition: service_healthy
      minio:
        condition: service_healthy
    image: ghcr.io/sneaksanddata/nexus:1.1.0
    volumes:
      - ./test-resources/kubecfg/controller:/opt/kubecfg/controller
      - ./test-resources/kubecfg/shards:/opt/kubecfg/shards
    environment:
      NEXUS__RESOURCE_NAMESPACE: nexus
      NEXUS__MAX_PAYLOAD_SIZE: 536870912
      NEXUS__S3_BUFFER__BUFFER_CONFIG__PAYLOAD_STORAGE_PATH: s3a://nexus
      NEXUS__S3_BUFFER__BUFFER_CONFIG__PAYLOAD_VALID_FOR: 72h
      NEXUS__S3_BUFFER__BUFFER_CONFIG__FAILURE_RATE_BASE_DELAY: 100ms
      NEXUS__S3_BUFFER__BUFFER_CONFIG__FAILURE_RATE_MAX_DELAY: 1s
      NEXUS__S3_BUFFER__BUFFER_CONFIG__RATE_LIMIT_ELEMENTS_PER_SECOND: 20
      NEXUS__S3_BUFFER__BUFFER_CONFIG__RATE_LIMIT_ELEMENTS_BURST: 200
      NEXUS__S3_BUFFER__BUFFER_CONFIG__WORKERS: 10
      NEXUS__KUBE_CONFIG_PATH: /opt/kubecfg/controller
      NEXUS__SHARD_KUBE_CONFIG_PATH: /opt/kubecfg/shards
      NEXUS__S3_BUFFER__ACCESS_KEY_ID: minioadmin
      NEXUS__S3_BUFFER__ENDPOINT: http://localhost:9000
      NEXUS__S3_BUFFER__REGION: us-east-1
      NEXUS__S3_BUFFER__SECRET_ACCESS_KEY: minioadmin
      NEXUS__CQL_STORE_TYPE: scylla
      NEXUS__SCYLLA_CQL_STORE__HOSTS: 127.0.0.1
      DD_DOGSTATSD_URL: udp://localhost:8125

  nexus-supervisor:
    container_name: nexus-supervisor
    network_mode: host
    depends_on:
      scylla:
        condition: service_healthy
    image: ghcr.io/sneaksanddata/nexus-supervisor:0.1.0
    volumes:
      - ./test-resources/kubecfg/shards/kind-nexus-shard-0.kubeconfig:/opt/kubecfg/cluster
    environment:
      NEXUS__RESOURCE_NAMESPACE: nexus
      NEXUS__KUBE_CONFIG_PATH: /opt/kubecfg/cluster
      NEXUS__CQL_STORE_TYPE: scylla
      NEXUS__FAILURE_RATE_BASE_DELAY: 100ms
      NEXUS__FAILURE_RATE_MAX_DELAY: 1s
      NEXUS__RATE_LIMIT_ELEMENTS_PER_SECOND: 5
      NEXUS__RATE_LIMIT_ELEMENTS_BURST: 100
      NEXUS__WORKERS: 10
      NEXUS__SCYLLA_CQL_STORE__HOSTS: 127.0.0.1
      DD_DOGSTATSD_URL: udp://localhost:8125

  nexus-receiver:
    container_name: nexus-receiver
    network_mode: host
    depends_on:
      scylla:
        condition: service_healthy
    image: ghcr.io/sneaksanddata/nexus-receiver:1.1.0
    volumes:
      - ./test-resources/kubecfg/shards/kind-nexus-shard-0.kubeconfig:/opt/kubecfg/cluster
    environment:
      NEXUS__RESOURCE_NAMESPACE: nexus
      NEXUS__KUBE_CONFIG_PATH: /opt/kubecfg/cluster
      NEXUS__CQL_STORE_TYPE: scylla
      NEXUS__FAILURE_RATE_BASE_DELAY: 100ms
      NEXUS__FAILURE_RATE_MAX_DELAY: 1s
      NEXUS__RATE_LIMIT_ELEMENTS_PER_SECOND: 5
      NEXUS__RATE_LIMIT_ELEMENTS_BURST: 100
      NEXUS__WORKERS: 10
      NEXUS__BIND_PORT: 8081
      NEXUS__SCYLLA_CQL_STORE__HOSTS: 127.0.0.1
      DD_DOGSTATSD_URL: udp://localhost:8125


  prepare_buckets:
    container_name: minio-setup
    image: quay.io/minio/minio
    network_mode: host
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        mc alias set e2e "http://localhost:9000" minioadmin minioadmin
        mc admin info e2e
        mc mb --ignore-existing e2e/tmp && mc mb --ignore-existing e2e/nexus
  prepare_scylla:
    container_name: scylla-setup
    image: scylladb/scylla
    network_mode: host
    volumes:
      - ./test-resources/storage:/opt/storage
    depends_on:
      scylla:
        condition: service_healthy
    entrypoint:
      - /opt/storage/prepare-scylla.sh