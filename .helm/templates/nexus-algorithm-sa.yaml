apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus
  namespace: nexus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nexus:serviceaccount:nexus
subjects:
  - kind: ServiceAccount
    name: nexus
    namespace: nexus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
