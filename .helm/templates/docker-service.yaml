{{ if eq .Values.dockerServiceType "mac" }}
apiVersion: v1
kind: Service
metadata:
  name: dockerhost
  namespace: nexus
spec:
  type: ExternalName
  sessionAffinity: None
  externalName: host.docker.internal
{{- end }}
---
{{ if eq .Values.dockerServiceType "linux" }}
apiVersion: v1
kind: Endpoints
metadata:
  name: dockerhost
subsets:
  - addresses:
      - ip: 172.17.0.1 # this is the gateway IP in the "bridge" docker network
---
apiVersion: v1
kind: Service
metadata:
  name: dockerhost
spec:
  clusterIP: None
{{- end }}
